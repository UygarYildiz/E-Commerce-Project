version: 2

models:
  - name: stg_orders
    description: S3'ten RDS e yüklenen orders tablosu
    columns:
      - name : order_id
        tests:
          - unique
          - not_null

      - name : customer_id
        tests:
         -  unique
         -  not_null
      
  - name: stg_customers
    description: Temizlenmiş Ham Veri Modeli "Silver-Layer"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  
  - name: stg_order_items
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id,order_item_id]

  - name: stg_order_payments
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id,payment_sequential]
    
  - name: stg_order_reviews
    description: | 
      VERİ KALİTESİ PROBLEMİ: Bu staging tablosunda review_id duplicate şekilde mevcut.
      Bunu önlemek ve testi sağlamak için composite key (review_id,order_id) kullanıldı.
      Mart layer a geçildiğinde bu sorun dikkate alınarak duplicateler engellenecek.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [review_id,order_id]
  
  - name: stg_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
          
  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_product_category_name_translation
    columns:
      - name: product_category_name
        tests:
          - unique
          - not_null
    
       

         

          
    
       
